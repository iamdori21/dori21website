<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D38" />
      <stop offset="45%" stop-color="#1B1B22" />
      <stop offset="100%" stop-color="#101014" />
    </linearGradient>
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Tile Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="3" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#glossGrad)" />

  <!-- 'd' letter and '21' badge -->
  <g id="logo-mark">
    <!-- Letter 'd' (Poppins bold geometry) -->
    <text x="216" y="360" font-family="'Poppins', 'Pretendard', -apple-system, sans-serif" font-size="285" font-weight="900" fill="#FFFFFF" text-anchor="middle">d</text>
    
    <!-- '21' Badge -->
    <g filter="url(#badgeShadow)">
      <circle cx="348" cy="222" r="62" fill="#FFC83D" stroke="#F4B400" stroke-width="2" />
      <text x="348" y="247" font-family="'Poppins', 'Pretendard', -apple-system, sans-serif" font-size="70" font-weight="900" fill="#5B3FE0" text-anchor="middle">21</text>
    </g>
  </g>
</svg>
